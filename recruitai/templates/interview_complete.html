<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interview Complete — RecruitAI</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7ff;--s:#ffffff;--s2:#f0f3fd;--border:#dde3f4;--accent:#4361ee;--accent2:#3a56d4;--green:#059669;--red:#dc2626;--text:#0f172a;--muted:#64748b;--muted2:#94a3b8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(67,97,238,0.06) 0%,transparent 60%);pointer-events:none;}
.brand{font-family:'Plus Jakarta Sans',sans-serif;font-size:18px;font-weight:800;color:var(--accent2);margin-bottom:40px;}
.card{background:var(--s);border:1px solid var(--border);border-radius:24px;padding:48px;max-width:620px;width:100%;text-align:center;z-index:1;box-shadow:0 20px 60px rgba(67,97,238,0.1);}
.icon{font-size:72px;margin-bottom:16px;animation:pop .6s ease;}
@keyframes pop{from{transform:scale(0.5);opacity:0}to{transform:scale(1);opacity:1}}
.title{font-family:'Playfair Display',serif;font-size:30px;font-weight:800;margin-bottom:8px;}
.sub{color:var(--muted);font-size:15px;margin-bottom:28px;line-height:1.7;}
.sched-box{background:linear-gradient(135deg,rgba(67,97,238,.07),rgba(67,97,238,.03));border:1px solid rgba(67,97,238,.2);border-radius:14px;padding:20px;margin-bottom:24px;text-align:left;}
.sched-label{font-size:11px;color:var(--accent2);text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-bottom:12px;}
.sched-row{display:flex;align-items:center;gap:10px;font-size:14px;margin-bottom:8px;}
.scores-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;}
.score-card{background:var(--s2);border:1px solid var(--border);border-radius:16px;padding:24px;}
.score-icon{font-size:36px;margin-bottom:6px;}
.score-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
.score-sub{font-size:12px;color:var(--muted2);margin-top:6px;}
.badge{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:30px;font-size:15px;font-weight:700;margin-bottom:24px;background:rgba(67,97,238,.08);color:var(--accent2);border:1px solid rgba(67,97,238,.2);}
.info-box{background:rgba(5,150,105,.06);border:1px solid rgba(5,150,105,.2);border-radius:12px;padding:16px 20px;margin-bottom:24px;text-align:left;}
.info-box p{font-size:13px;color:#065f46;line-height:1.8;}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.btn-p{padding:12px 28px;background:var(--accent);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;transition:all .2s;}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(67,97,238,0.3);}
.btn-s{padding:12px 24px;background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;transition:all .2s;}
.btn-s:hover{border-color:var(--accent);color:var(--accent2);}
</style>
</head>
<body>
<span class="brand">🤖 RecruitAI</span>
<div class="card" id="card">
  <div class="icon">⏳</div>
  <div class="title" style="font-size:22px;color:var(--muted);">Loading…</div>
</div>
<script>
window.API_BASE = (location.port==='3000')?'http://localhost:5000':'';
const _origFetch=window.fetch;
window.fetch=(url,opts={})=>{
  if(typeof url==='string'&&url.startsWith('/')&&window.API_BASE)url=window.API_BASE+url;
  opts.credentials=opts.credentials||'include';
  opts.headers={...(opts.headers||{}),'ngrok-skip-browser-warning':'true'};
  return _origFetch(url,opts);
};

const params=new URLSearchParams(location.search);
const sessionId=params.get('session');
const subId=params.get('sub');

async function init(){
  try{
    const[sessionData,subData]=await Promise.all([
      sessionId?fetch(`/api/interview-complete/${sessionId}`).then(r=>r.json()):Promise.resolve(null),
      subId?fetch(`/api/results/${subId}`).then(r=>r.json()):Promise.resolve(null)
    ]);
    const card=document.getElementById('card');
    const sess=sessionData?.session;
    const sched=sessionData?.scheduled;
    const sub=subData?.submission||sessionData?.submission;
    const jobRole=sess?.job_role||sub?.job_role||'Interview';
    const mode=(sess?.mode||sub?.mode||'ai_interview').replace(/_/g,' ');
    const credScore=sub?.credibility_score??sess?.credibility_score??100;
    const integrityLabel=credScore>=80?'✅ Highly Trustworthy':credScore>=60?'⚠️ Acceptable':'❌ Needs Review';

    let schedHtml='';
    if(sched){
      schedHtml=`<div class="sched-box">
        <div class="sched-label">📅 Interview Details</div>
        <div class="sched-row">🏢 <strong>${sched.company_name||''}</strong></div>
        <div class="sched-row">💼 ${sched.job_role||jobRole}</div>
        <div class="sched-row">👤 Recruiter: ${sched.recruiter_name||''}</div>
        ${sched.scheduled_at?`<div class="sched-row">🗓️ <strong>${sched.scheduled_at}</strong></div>`:''}
        ${sched.calendar_link?`<div class="sched-row"><a href="${sched.calendar_link}" target="_blank" style="color:var(--accent2)">📅 Google Calendar</a></div>`:''}
      </div>`;
    }

    card.innerHTML=`
      <div class="icon">🎉</div>
      <div class="title">Interview Submitted!</div>
      <div class="sub">Your <strong>${mode}</strong> interview for <strong>${jobRole}</strong> has been recorded and submitted successfully.<br>Your recruiter will review your performance and contact you soon.</div>
      ${schedHtml}
      <div class="scores-row">
        <div class="score-card">
          <div class="score-icon">🔒</div>
          <div class="score-label">Interview Score</div>
          <div class="score-sub">Under Recruiter Review</div>
        </div>
        <div class="score-card">
          <div class="score-icon">🛡️</div>
          <div class="score-label">Interview Integrity</div>
          <div class="score-sub">${integrityLabel}</div>
        </div>
      </div>
      <div class="badge">⏳ Pending Recruiter Review</div>
      <div class="info-box">
        <p>✅ Your answers have been recorded and saved.<br>
        📧 You will be notified once the recruiter reviews your performance.<br>
        🔒 Interview scores are only visible to the recruiter.</p>
      </div>
      <div class="actions">
        <a href="test.html" class="btn-p">↩ Back to Portal</a>
        ${sched?.calendar_link?`<a href="${sched.calendar_link}" target="_blank" class="btn-s">📅 Calendar</a>`:''}
      </div>`;
  }catch(e){
    document.getElementById('card').innerHTML=`
      <div class="icon">✅</div>
      <div class="title">Interview Submitted!</div>
      <div class="sub">Your interview has been recorded. Your recruiter will review and contact you soon.</div>
      <div class="actions" style="margin-top:24px;"><a href="test.html" class="btn-p">↩ Back to Portal</a></div>`;
  }
}
init();
</script>
</body>
</html>
